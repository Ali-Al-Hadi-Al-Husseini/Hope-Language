# This workflow will build and test a golang project inside the hope-go directory
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    paths:
      - "hope-go/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "hope-go/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hope-go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hope-go/go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Build
        run: go build -v ./...

      - name: Test with gotestsum
        run: gotestsum --format pkgname-and-test-fails --junitfile test-results.xml -- -v ./...
